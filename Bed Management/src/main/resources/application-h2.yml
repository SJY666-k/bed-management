# 本地免装 MySQL 的演示 profile：java -jar bed-management-1.0.0.jar --spring.profiles.active=h2
# 数据存放在 H2 内存库，每次启动按 db/h2-schema.sql + db/h2-data.sql 重建，
# 演示数据与 sql/yiyang_bed.sql 一致。
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:yiyang;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2-schema.sql
      data-locations: classpath:db/h2-data.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
