# 东软颐养中心管理系统 —— 床位管理模块（默认 profile 使用 MySQL）
server:
  port: 8080
  servlet:
    # 与前端 axios baseURL、Vite 代理前缀保持一致
    context-path: /api

spring:
  application:
    name: bed-management

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 库名按实际环境修改，建库脚本见 sql/yiyang_bed.sql
    url: jdbc:mysql://localhost:3306/yiyang?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    # TODO 按实际环境修改密码
    password: 123456

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      # 日期输出为字符串，不要时间戳
      write-dates-as-timestamps: false
    default-property-inclusion: always

# MyBatis-Plus 配置
mybatis-plus:
  # XML 映射文件位置
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.neusoft.yiyang.entity
  configuration:
    # 下划线字段自动映射为驼峰属性：bed_status -> bedStatus
    map-underscore-to-camel-case: true
    # 打印 SQL 便于调试，生产环境建议关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键策略：数据库自增
      id-type: auto

# Swagger 接口文档地址： http://localhost:8080/api/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.neusoft.yiyang: debug

yiyang:
  # 楼房编号，用于拼接「床位详情」描述
  building-no: "606"
