# =====================================================================
#  本地免安装 MySQL 的演示 profile
#  启动方式： java -jar bed-management-1.0.0.jar --spring.profiles.active=h2
#          或在 IDEA 的「VM options / Active profiles」里填写 h2
#  数据放在内存里（H2），每次重启都会按 db/h2-schema.sql + db/h2-data.sql 重建，
#  演示数据与 sql/yiyang_bed.sql 完全一致。
# =====================================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:yiyang;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2-schema.sql
      data-locations: classpath:db/h2-data.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
